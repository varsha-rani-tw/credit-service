[tool.poetry]
name = "credit-service"
version = "0.1.0"
description = "Credit service for CIBIL score simulation"
authors = ["varsharani"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.8"
dependency-injector = "^4.41.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
aiokafka = "^0.11.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
